:root {
  --bg: #05060a;
  --ink: rgba(235, 240, 250, .92);
  --ink-dim: rgba(235, 240, 250, .45);
  --ink-faint: rgba(235, 240, 250, .22);

}

  background: var(--bg);

  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}

.stage {
  position: fixed; inset: 0;
  background:
    radial-gradient(120% 90% at 50% 8%, rgba(30, 38, 60, .35), transparent 55%),
    radial-gradient(140% 100% at 50% 115%, rgba(16, 20, 34, .5), transparent 60%),
    var(--bg);
}

/* 底部氛围光: 双层交替渐隐, 颜色跟随当前场景 (轮播视图的核心味道) */
.ambient {
  position: fixed; left: 50%; bottom: -42vh;
  width: 130vw; height: 90vh;
  transform: translateX(-50%);
  border-radius: 50%;
  filter: blur(60px);
  opacity: 0;
  transition: opacity 1.1s ease;
  pointer-events: none;
}
.ambient.on { opacity: .5; }

/* 尘埃画布 */
#dust { position: fixed; inset: 0; pointer-events: none; }

/* ---------- 编辑式页眉 (AI Garden 味道) ---------- */
header {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: center;
  padding: 34px 44px;
  z-index: 30;
}
.brand {
  font-family: var(--sans-en);
  font-size: 11px; font-weight: 300;
  letter-spacing: .42em;
  color: var(--ink-dim);
  text-transform: uppercase;
}
.brand b { font-weight: 600; color: var(--ink); }
.hint {
  font-family: var(--sans-en);
  font-size: 10px; font-weight: 300;
  letter-spacing: .22em;
  color: var(--ink-faint);
  text-transform: uppercase;
}

/* ---------- 轮播 ---------- */
.carousel {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  cursor: grab;
}
.carousel.dragging { cursor: grabbing; }

.orb-slot {
  position: absolute; left: 50%; top: 44%;
  will-change: transform, filter, opacity;
}

/* 中心球缓慢浮动 */
.orb-bob { animation: bob 7s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-10px); }
}

/* ---------- 玻璃球本体 ---------- */
.orb {
  position: relative;
  width: var(--orb-size); height: var(--orb-size);
  border-radius: 50%;
  overflow: hidden;
  /* 球体纵深: 底部收暗 + 顶部提亮 + 外圈细描边 */
  box-shadow:
    inset 0 calc(var(--orb-size) * -0.14) calc(var(--orb-size) * 0.22) rgba(0, 0, 0, .62),
    inset 0 calc(var(--orb-size) * 0.09) calc(var(--orb-size) * 0.14) rgba(255, 255, 255, .16),
    inset 0 2px 6px rgba(255, 255, 255, .22),
    inset 0 0 0 1px rgba(255, 255, 255, .09),
    0 calc(var(--orb-size) * 0.10) calc(var(--orb-size) * 0.24) rgba(0, 0, 0, .55);
  transform: translateZ(0);
}

/* 球内真实照片 — 双层「圆顶玻璃」方案:
   底层深度失焦铺满整球做氛围, 上层较清晰但只在球心露出、向边缘溶进磨砂 —
   轮播时看得出场景在里面缓慢放映(运镜), 又始终隔着一层玻璃的暧昧;
   点击进入后底层失焦融化成整幅清晰影像 */
.orb-img-blur, .orb-img-core {
  position: absolute; inset: -12%;
  background-size: cover;
  background-position: center;
  animation: dreamPan 18s ease-in-out infinite alternate;
  transition: filter 1.1s ease, opacity 1.1s ease;
  will-change: transform, filter;
}
.orb-img-blur {
  filter: blur(18px) saturate(1.4) brightness(.5);
  opacity: .4;
}
.orb-img-core {
  filter: blur(1.5px) saturate(1.1) brightness(.58);
  opacity: .8;
  -webkit-mask-image: radial-gradient(circle at 50% 47%, #000 24%, transparent 62%);
  mask-image: radial-gradient(circle at 50% 47%, #000 24%, transparent 62%);
}
@keyframes dreamPan {
  from { transform: scale(1.26) translate(-3%, -2%); }
  to   { transform: scale(1.38) translate(3%, 2.5%); }
}
/* 真实电影片段 (videos/orb-*.mp4, CC 素材见 videos/CREDITS.txt):
   梦境态压暗+轻微失焦, 场景在玻璃里真实地放映; 展开时变清 */
.orb-vid {
  position: absolute; left: -2%; top: -2%;
  width: 104%; height: 104%;
  object-fit: cover;
  filter: blur(1.5px) saturate(1.1) brightness(.45);
  transition: filter 1.1s ease, opacity 1.1s ease;
}
body.expanded .orb-slot.center .orb-vid {
  filter: blur(0px) saturate(1.05) brightness(.98);
}
/* 视频就绪后照片层退场 (视频加载失败时照片层兜底) */
.orb-slot.has-video .orb-img-blur { opacity: 0; }
.orb-slot.has-video .orb-img-core { opacity: 0; }
/* 场景色彩签名: 每颗球一层自己颜色的微光, 梦境态里区分气质 */
.orb-tint {
  position: absolute; inset: 0; border-radius: 50%;
  mix-blend-mode: screen;
  opacity: .28;
  transition: opacity 1.1s ease;
}
/* 展开态: 中心球玻璃变清 — 失焦融化, 真实影像带着缓慢运镜浮现 */
body.expanded .orb-slot.center .orb-img-blur {
  filter: blur(0px) saturate(1.08) brightness(1);
  opacity: 1;
}
body.expanded .orb-slot.center .orb-img-core { opacity: 0; }
body.expanded .orb-slot.center .orb-tint { opacity: 0; }
body.expanded .orb-slot.center .orb-haze { opacity: .45; }
body.expanded .orb-slot.center .orb-irid { animation-play-state: paused; }

/* 展开态: 场景影像溢出玻璃, 化作全屏氛围底 */
.backdrop {
  position: fixed; inset: -70px;
  background-size: cover;
  background-position: center;
  filter: blur(64px) brightness(.42) saturate(1.35);
  opacity: 0;
  transition: opacity 1.3s ease;
  pointer-events: none;
}
body.expanded .backdrop { opacity: .55; }

/* 磨砂边缘: 边缘微微起雾, 中心通透 */
.orb-haze {
  position: absolute; inset: 0; border-radius: 50%;
  transition: opacity 1.1s ease;
  background:
    radial-gradient(circle at 50% 46%,
      transparent 48%,
      rgba(10, 12, 20, .28) 70%,
      rgba(16, 20, 34, .66) 96%);
}

/* 虹彩色带: siri 球的签名 — 上三分之一横向铺一条柔和光谱 */
.orb-irid {
  position: absolute; left: -12%; right: -12%; top: 16%;
  height: 34%;
  background: linear-gradient(100deg,
    rgba(255, 140, 120, 0)   8%,
    rgba(255, 175, 105, .70) 26%,
    rgba(150, 235, 255, .80) 46%,
    rgba(155, 160, 255, .65) 62%,
    rgba(255, 150, 215, .50) 78%,
    rgba(255, 150, 215, 0)   94%);
  border-radius: 50%;
  filter: blur(calc(var(--orb-size) * 0.038));
  mix-blend-mode: screen;
  opacity: .9;
  animation: iridShift 9s ease-in-out infinite;
}
@keyframes iridShift {
  0%, 100% { transform: translateX(-3%) scaleY(1); }
  50%      { transform: translateX(3%)  scaleY(1.12); }
}

/* 顶部高光 */
.orb-spec {
  position: absolute; left: 22%; top: 4%;
  width: 56%; height: 27%;
  background: radial-gradient(50% 50% at 50% 50%,
    rgba(255, 255, 255, .72), rgba(255, 255, 255, 0) 72%);
  border-radius: 50%;
  filter: blur(calc(var(--orb-size) * 0.012));
  mix-blend-mode: screen;
}
/* 小而锐的次高光点, 玻璃「点睛」 */
.orb-spec::after {
  content: '';
  position: absolute; left: 30%; top: 26%;
  width: 17%; height: 30%;
  background: radial-gradient(50% 50% at 50% 50%,
    rgba(255, 255, 255, .95), rgba(255, 255, 255, 0) 70%);
  border-radius: 50%;
}
/* 左下弱反光, 补一笔玻璃感 */
.orb-spec2 {
  position: absolute; left: 10%; bottom: 8%;
  width: 30%; height: 14%;
  background: radial-gradient(50% 50% at 50% 50%,
    rgba(210, 230, 255, .22), transparent 70%);
  border-radius: 50%;
  filter: blur(calc(var(--orb-size) * 0.02));
  mix-blend-mode: screen;
}

/* 地面光池: 球下方一汪光, 颜色随场景 */
.orb-pool {
  position: absolute; left: 50%; top: 104%;
  width: 86%; height: 12%;
  transform: translateX(-50%);
  border-radius: 50%;
  filter: blur(calc(var(--orb-size) * 0.05));
  opacity: .55;
}

/* ---------- 下方内容栈 (名称 / 描述 / 语音操作) ---------- */
.info {
  position: fixed; left: 50%; top: calc(44% + var(--center-size) / 2 + 66px);
  transform: translateX(-50%);
  text-align: center;
  z-index: 20;
  width: min(80vw, 560px);
  transition: transform .95s cubic-bezier(.3, .7, .3, 1);
}
body.expanded .info { transform: translateX(-50%) translateY(26px); }
.info-inner { transition: opacity .32s ease, transform .32s ease; }
.info-inner.out { opacity: 0; transform: translateY(10px); }

.scene-en {
  font-family: var(--sans-en);
  font-size: 10px; font-weight: 400;
  letter-spacing: .5em; text-indent: .5em;
  color: var(--ink-faint);
  text-transform: uppercase;
  margin-bottom: 14px;
}
.scene-title {
  font-size: 30px; font-weight: 600;
  letter-spacing: .06em;
  margin-bottom: 12px;
}
.scene-desc {
  font-size: 14px; font-weight: 300;
  letter-spacing: .04em;
  line-height: 1.7;
  color: var(--ink-dim);
  margin-bottom: 26px;
  max-height: 60px;
  transition: opacity .5s ease, max-height .5s ease, margin .5s ease;
}
/* 触发型场景的小标签 (里程碑 / AMG 赛道日) */
.scene-tag {
  display: inline-block;
  margin-left: 12px;
  padding: 3px 11px;
  border-radius: 100px;
  border: 1px solid rgba(255, 255, 255, .14);
  font-family: var(--sans-zh);
  font-size: 10px; font-weight: 400;
  letter-spacing: .12em; text-indent: 0;
  color: var(--accent, rgba(235, 240, 250, .5));
  vertical-align: 1px;
}
.scene-tag:empty { display: none; }

/* 展开态数据卡: 轮播只给感觉, 进来才亮出真实数据 */
.detail-card {
  max-height: 0; opacity: 0; overflow: hidden;
  margin: 0 auto;
  width: min(78vw, 430px);
  border-radius: 20px;
  background: rgba(255, 255, 255, .045);
  border: 1px solid rgba(255, 255, 255, .09);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  transition: max-height .7s cubic-bezier(.3, .7, .3, 1), opacity .7s ease, margin .7s ease;
  text-align: left;
}
body.expanded .detail-card { max-height: 420px; opacity: 1; margin-bottom: 26px; }
body.expanded .scene-desc { opacity: 0; max-height: 0; margin-bottom: 0; }
.dc-row {
  display: flex; justify-content: space-between; align-items: baseline; gap: 18px;
  padding: 13px 22px;
}
.dc-row + .dc-row { border-top: 1px solid rgba(255, 255, 255, .06); }
.dc-k {
  font-size: 12px; font-weight: 300;
  letter-spacing: .08em;
  color: var(--ink-faint);
  white-space: nowrap;
}
.dc-v {
  font-size: 13px; font-weight: 400;
  letter-spacing: .04em;
  color: var(--ink);
  text-align: right;
}

/* 语音胶囊: 玻璃底 + 呼吸圆点 */
.voice-chip {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 11px 22px;
  border-radius: 100px;
  background: rgba(255, 255, 255, .05);
  border: 1px solid rgba(255, 255, 255, .1);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  font-size: 13px; font-weight: 300;
  letter-spacing: .06em;
  color: var(--ink);
  cursor: pointer;
  transition: background .3s ease, border-color .3s ease;
}
.voice-chip:hover { background: rgba(255, 255, 255, .09); }
.voice-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent, #8fb8ff);
  box-shadow: 0 0 10px var(--accent, #8fb8ff);
  animation: pulse 2.2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: .5; transform: scale(.85); }
  50%      { opacity: 1;  transform: scale(1.15); }
}

/* ---------- 圆点分页 ---------- */
.dots {
  position: fixed; left: 50%; bottom: 40px;
  transform: translateX(-50%);
  display: flex; gap: 14px;
  z-index: 30;
}
.dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: rgba(255, 255, 255, .18);
  cursor: pointer;
  transition: all .4s ease;
}
.dot.on {
  background: rgba(255, 255, 255, .85);
  box-shadow: 0 0 8px rgba(255, 255, 255, .5);
  transform: scale(1.3);
}
/* 展开态: 轮播锁定, 圆点退场把纵向空间让给数据卡 */
.dots { transition: opacity .6s ease; }
body.expanded .dots { opacity: 0; pointer-events: none; }

/* 明确的返回按钮: 移动端点击球体可能被滚动手势吞掉, 这颗胶囊永远可点 */
.close-pill {
  position: fixed; top: 76px; right: 44px;
  z-index: 40;
  padding: 9px 18px;
  border-radius: 100px;
  background: rgba(255, 255, 255, .06);
  border: 1px solid rgba(255, 255, 255, .14);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  font-size: 12px; font-weight: 300;
  letter-spacing: .08em;
  color: var(--ink);
  cursor: pointer;
  opacity: 0; pointer-events: none;
  transition: opacity .5s ease, background .3s ease;
}
.close-pill:hover { background: rgba(255, 255, 255, .1); }
body.expanded .close-pill { opacity: 1; pointer-events: auto; }
@media (max-width: 720px) { .close-pill { top: 62px; right: 22px; } }

@media (max-width: 720px) {
  header { padding: 24px 22px; }
  .brand { letter-spacing: .3em; font-size: 10px; }
  .hint { display: none; }
  .scene-title { font-size: 24px; }
  .scene-desc { font-size: 13px; }
  /* 窄屏展开态: 数据卡行会折行变高, 整个信息栈上提避免底部截断 */
  body.expanded .info { transform: translateX(-50%) translateY(-64px); }
  .dc-row { padding: 11px 16px; }
}

<script>
(function(){
  var KEY='aios_demo_unlock_v1';
  var HASH='cc35f579797e106bb3ea97001fc565e8eb7d6b0a385920f2fc6721ddcc606d59';
  function ok(){try{return localStorage.getItem(KEY)===HASH;}catch(e){return false;}}
  if(ok())return;
  function sha(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');});}

<script>
/* ============================================================
   数据: 5 个场景球 (照片沿用 images/orb-*.jpg, 已确立的真实影像方向)
   ============================================================ */

const N = SCENES.length;

/* ============================================================
   轮播引擎: 连续位置 pos (浮点) + 1:1 拖拽 + 补间吸附
   环形取最短距离, 无限循环
   ============================================================ */
const carousel = document.getElementById('carousel');
const CENTER = () => Math.min(innerWidth * 0.52, innerHeight * 0.42, 360); // 中心球直径 (窄屏时占屏一半, 参考轮播视频)
const SPACING = () => Math.max(CENTER() * 0.82, Math.min(innerWidth * 0.30, 330)); // 相邻球间距

document.documentElement.style.setProperty('--center-size', CENTER() + 'px');

/* 构建球 DOM */
const slots = SCENES.map((s, i) => {
  const slot = document.createElement('div');
  slot.className = 'orb-slot';
  slot.innerHTML = `
    <div class="orb-bob">
      <div class="orb">
        <div class="orb-img-blur"></div>
        <div class="orb-img-core"></div>
        <video class="orb-vid" muted loop playsinline autoplay preload="auto"></video>
        <div class="orb-tint" style="background: radial-gradient(62% 62% at 50% 60%, ${s.glow}, transparent 76%)"></div>
        <div class="orb-haze"></div>
        <div class="orb-irid"></div>
        <div class="orb-spec"></div>
        <div class="orb-spec2"></div>
      </div>
      <div class="orb-pool" style="background: radial-gradient(50% 50% at 50% 50%, ${s.glow}, transparent 70%)"></div>
    </div>`;
  /* 用 pointerup 判定「轻点」而非 click —
     click 在移动端/可滚动容器里容易被手指微动吞掉, pointerup 更可靠 */
  slot.addEventListener('pointerup', e => {
    if (dragMoved) return;
    if (e.button !== undefined && e.button !== 0) return;
    const d = shortest(i - mod(Math.round(pos), N));
    if (d === 0) toggleExpand();          // 点中心球: 玻璃变清, 进入真实内容
    else if (!expanded) tweenTo(Math.round(pos) + d);
  });
  /* 照片通过 JS 赋给两层, base64 源只在 SCENES 里存一份 */
  slot.querySelectorAll('.orb-img-blur, .orb-img-core').forEach(el => {
    el.style.backgroundImage = `url('${s.img}')`;
  });
  /* 真实电影片段: 就绪后接管画面, 失败则保持照片层 */
  const vid = slot.querySelector('.orb-vid');
  vid.muted = true;
  vid.src = `videos/orb-${s.id}.mp4`;
  vid.addEventListener('canplay', () => {
    slot.classList.add('has-video');
    vid.play().catch(() => {});
  });
  vid.addEventListener('error', () => slot.classList.remove('has-video'));
  carousel.appendChild(slot);
  return slot;
});

const mod = (n, m) => ((n % m) + m) % m;
/* i 相对当前位置的最短环形偏移 */
function shortest(d) {
  d = mod(d, N);
  if (d > N / 2) d -= N;
  return d;
}

let pos = 0;            // 连续位置
let active = 0;         // 当前场景索引
let snapTarget = 0;     // 最近一次吸附目标 (连按方向键/滚轮时在它基础上累加)
let tween = null;
let expanded = false;   // 展开态: 中心球玻璃变清, 显示真实内容
let expandT = 0;        // 展开补间 0..1
let expandRaf = null;

function render() {
  const size = CENTER();
  const gap = SPACING();
  slots.forEach((slot, i) => {
    const d = shortest(i - pos);          // -2.5 .. 2.5
    const ad = Math.abs(d);
    const centerness = Math.max(0, 1 - ad * 2);       // 1=正中心, 0=偏离半格以上
    const x = d * gap * (1 - ad * 0.09);  // 越远间距略收拢
    let scale = Math.max(0.28, 1 - ad * 0.42);
    scale *= 1 + 0.34 * expandT * centerness;         // 展开时中心球放大
    const y = ad * size * 0.05 - expandT * centerness * size * 0.07;
    slot.style.setProperty('--orb-size', size + 'px');
    slot.style.transform =
      `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${scale})`;
    slot.style.zIndex = String(100 - Math.round(ad * 10));
    const fade = ad > 2.2 ? Math.max(0, 1 - (ad - 2.2) * 2.2) : 1;
    slot.style.opacity = String(fade * (ad < 0.5 ? 1 : 1 - 0.82 * expandT)); // 展开时两侧退场
    slot.style.filter =
      `brightness(${Math.max(.35, 1 - ad * 0.38)}) blur(${Math.max(0, ad - 0.35) * 2.2}px)`;
    slot.style.pointerEvents = (expanded && ad >= 0.5) ? 'none' : 'auto';
    slot.classList.toggle('center', ad < 0.5);
    /* 只有中心球浮动 + 满虹彩 */
    slot.querySelector('.orb-bob').style.animationPlayState = ad < 0.5 ? 'running' : 'paused';
    slot.querySelector('.orb-irid').style.opacity =
      String(Math.max(.25, .85 - ad * .5) * (1 - 0.75 * expandT * centerness));
    slot.querySelector('.orb-pool').style.opacity = String(Math.max(0, .55 - ad * .45));
  });

  const cur = mod(Math.round(pos), N);
  if (cur !== active) { active = cur; onSceneChange(); }
}

/* ---------- 展开 / 收拢: 玻璃变清 ↔ 蒙回磨砂 ---------- */
const backdropEl = document.getElementById('backdrop');
const hintEl = document.getElementById('hint');
document.getElementById('closePill').addEventListener('pointerup', () => {
  if (expanded) toggleExpand();
});

function tweenExpand(to, dur = 950) {
  if (expandRaf) cancelAnimationFrame(expandRaf);
  const from = expandT, delta = to - from, t0 = performance.now();
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const step = now => {
    const t = Math.min(1, (now - t0) / dur);
    expandT = from + delta * ease(t);
    render();
    if (t < 1) expandRaf = requestAnimationFrame(step);
    else expandRaf = null;
  };
  expandRaf = requestAnimationFrame(step);
}

function toggleExpand() {
  expanded = !expanded;
  const s = SCENES[active];
  if (expanded) {
    backdropEl.style.backgroundImage = `url('${s.img}')`;
    document.body.classList.add('expanded');
    hintEl.textContent = '点击球体 · ESC 返回';
  } else {
    document.body.classList.remove('expanded');
    hintEl.textContent = 'Drag · Scroll · 点击进入';
  }
  tweenExpand(expanded ? 1 : 0);
  swapInfo();  // 描述文案在 感觉一句话 ↔ 真实内容 之间切换
}

function tweenTo(target, dur = 620) {
  if (tween) cancelAnimationFrame(tween.raf);
  snapTarget = target;
  const from = pos, delta = target - from, t0 = performance.now();
  const ease = t => 1 - Math.pow(1 - t, 3.2);
  const step = now => {
    const t = Math.min(1, (now - t0) / dur);
    pos = from + delta * ease(t);
    render();
    if (t < 1) tween.raf = requestAnimationFrame(step);
    else { pos = mod(target, N); snapTarget = pos; tween = null; render(); }
  };
  tween = { raf: requestAnimationFrame(step) };
}

/* ---------- 拖拽 (1:1 跟手) ---------- */
let dragging = false, dragMoved = false, startX = 0, startPos = 0, lastX = 0, lastT = 0, vel = 0;

carousel.addEventListener('pointerdown', e => {
  if (expanded) return;                    // 展开态锁定轮播
  dragging = true; dragMoved = false;
  startX = lastX = e.clientX; startPos = pos;
  lastT = performance.now(); vel = 0;
  if (tween) { cancelAnimationFrame(tween.raf); tween = null; }
  carousel.classList.add('dragging');
  /* 注意: 不能在 pointerdown 就 setPointerCapture —
     捕获会把后续 click 事件改派给 carousel, 球上的点击处理器永远收不到 */
});
carousel.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - startX;
  if (!dragMoved && Math.abs(dx) > 4) {
    dragMoved = true;
    carousel.setPointerCapture(e.pointerId); // 确认是拖拽后才捕获, 保证指针滑出窗口也能收尾
  }
  const now = performance.now();
  vel = (e.clientX - lastX) / Math.max(1, now - lastT);
  lastX = e.clientX; lastT = now;
  pos = startPos - dx / SPACING();
  render();
});
const endDrag = () => {
  if (!dragging) return;
  dragging = false;
  carousel.classList.remove('dragging');
  /* 惯性: 速度换算成额外滑动距离, 再吸附 */
  const fling = -vel * 260 / SPACING();
  const target = Math.round(pos + Math.max(-1.6, Math.min(1.6, fling)));
  tweenTo(target);
  setTimeout(() => dragMoved = false, 50);
};
carousel.addEventListener('pointerup', endDrag);
carousel.addEventListener('pointercancel', endDrag);

/* ---------- 滚轮 / 键盘 ---------- */
let wheelLock = 0;
addEventListener('wheel', e => {
  if (expanded) return;
  const now = performance.now();
  if (now < wheelLock) return;
  const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if (Math.abs(delta) < 12) return;
  wheelLock = now + 480;
  tweenTo(snapTarget + (delta > 0 ? 1 : -1));
}, { passive: true });

addEventListener('keydown', e => {
  if (e.key === 'Escape' && expanded) { toggleExpand(); return; }
  if (e.key === 'Enter' && !expanded)  { toggleExpand(); return; }
  if (expanded) return;
  if (e.key === 'ArrowRight') tweenTo(snapTarget + 1);
  if (e.key === 'ArrowLeft')  tweenTo(snapTarget - 1);
});

/* ============================================================
   场景切换: 文案交叉淡入 + 氛围光换色 + 圆点
   ============================================================ */
const infoInner = document.getElementById('infoInner');
const ambA = document.getElementById('ambientA');
const ambB = document.getElementById('ambientB');
let ambFlip = false;

const dotsBox = document.getElementById('dots');
const dots = SCENES.map((_, i) => {
  const d = document.createElement('div');
  d.className = 'dot';
  d.addEventListener('click', () => tweenTo(Math.round(pos) + shortest(i - mod(Math.round(pos), N))));
  dotsBox.appendChild(d);
  return d;
});

let infoTimer = null;
function swapInfo() {
  const s = SCENES[active];
  /* 文案: 先滑出再换内容滑入; 展开态显示真实内容 detail, 轮播态只给一句感觉 desc */
  infoInner.classList.add('out');
  clearTimeout(infoTimer);
  infoTimer = setTimeout(() => {
    document.getElementById('sceneEn').textContent = s.en;
    document.getElementById('sceneTag').textContent = s.tag || '';
    document.getElementById('sceneTitle').textContent = s.title;
    document.getElementById('sceneDesc').textContent = s.desc;
    /* 数据卡: 展开后才亮出来的真实内容 */
    document.getElementById('detailCard').innerHTML = s.rows.map(([k, v]) =>
      `<div class="dc-row"><span class="dc-k">${k}</span><span class="dc-v">${v}</span></div>`
    ).join('');
    document.getElementById('voiceText').textContent = s.voice;
    infoInner.style.setProperty('--accent', s.accent);
    document.querySelector('.voice-dot').style.background = s.accent;
    document.querySelector('.voice-dot').style.boxShadow = `0 0 10px ${s.accent}`;
    infoInner.classList.remove('out');
  }, 300);
}
function onSceneChange() {
  const s = SCENES[active];
  swapInfo();

  /* 氛围光双层交替 */
  const inLayer = ambFlip ? ambA : ambB;
  const outLayer = ambFlip ? ambB : ambA;
  inLayer.style.background = `radial-gradient(50% 50% at 50% 50%, ${s.glow}, transparent 70%)`;
  inLayer.classList.add('on');
  outLayer.classList.remove('on');
  ambFlip = !ambFlip;

  dots.forEach((d, i) => d.classList.toggle('on', i === active));
}

/* ============================================================
   尘埃: 一层极淡的漂浮微粒
   ============================================================ */
const cv = document.getElementById('dust');
const cx = cv.getContext('2d');
let dustP = [];
function initDust() {
  cv.width = innerWidth * devicePixelRatio;
  cv.height = innerHeight * devicePixelRatio;
  cv.style.width = innerWidth + 'px';
  cv.style.height = innerHeight + 'px';
  cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  dustP = Array.from({ length: 55 }, () => ({
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight,
    r: .4 + Math.random() * 1.1,
    a: .04 + Math.random() * .12,
    vx: (Math.random() - .5) * .08,
    vy: -.03 - Math.random() * .07,
    ph: Math.random() * Math.PI * 2
  }));
}
function dustTick(t) {
  cx.clearRect(0, 0, innerWidth, innerHeight);
  for (const p of dustP) {
    p.x += p.vx; p.y += p.vy;
    if (p.y < -4) { p.y = innerHeight + 4; p.x = Math.random() * innerWidth; }
    if (p.x < -4) p.x = innerWidth + 4;
    if (p.x > innerWidth + 4) p.x = -4;
    const tw = .6 + .4 * Math.sin(t * .0007 + p.ph);
    cx.beginPath();
    cx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    cx.fillStyle = `rgba(215, 228, 255, ${p.a * tw})`;
    cx.fill();
  }
  requestAnimationFrame(dustTick);
}

/* ---------- 启动 ---------- */
addEventListener('resize', () => {
  document.documentElement.style.setProperty('--center-size', CENTER() + 'px');
  initDust();
  render();
});

initDust();
requestAnimationFrame(dustTick);
render();
onSceneChange();
</script>
